[project]
name = "gmod"
version = "0.1.0"
description = "Git-археолог: AI-анализ кода с визуализацией метрик"
authors = [
    {name = "GMod Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "gitpython>=3.1.40",
    "tree-sitter>=0.20.0",
    "litellm>=1.0.0",
    "pyqtgraph>=0.13.0",
    "networkx>=3.2.0",
    "pydantic>=2.5.0",
    # "qdarktheme>=2.1.0",  # Temporarily disabled - requires Python 3.11+
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
